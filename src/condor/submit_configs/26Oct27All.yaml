# Skim campaign 26Oct27 (LPC). Per-year config: top-level keys are years.
# 2022-2023BPix: 26Mar5All.yaml sample set + SingleTop + inclusive diboson (WW, WZ, ZZ).
# 2024: same physics content with the 2024 index names (data/index_2024.json, read via FNAL),
#       incl. the ggF kl BSM points.
# Known gaps (no dataset in the index; to be filled in postprocessing by lumi scaling):
#   2023: SingleTop TbarWplustoLNu2Q;  2023BPix: diboson ZZ.

# ---- shared blocks (2022-2023BPix use the same subsample names) ----
_hhbbtt_2022_2023: &hhbbtt_2022_2023
  subsamples:
    - GluGlutoHHto2B2Tau_kl-1p00_kt-1p00_c2-0p00
    - GluGlutoHHto2B2Tau_kl-0p00_kt-1p00_c2-0p00
    - GluGlutoHHto2B2Tau_kl-2p45_kt-1p00_c2-0p00
    - GluGlutoHHto2B2Tau_kl-5p00_kt-1p00_c2-0p00
    - VBFHHto2B2Tau_CV_1_C2V_0_C3_1
    - VBFHHto2B2Tau_CV_1_C2V_1_C3_1
  files_per_job: 20

_vjets_2022_2023: &vjets_2022_2023
  subsamples:
    - DYto2L-2Jets_MLL-50_0J
    - DYto2L-2Jets_MLL-50_1J
    - DYto2L-2Jets_MLL-50_2J
    - Wto2Q-2Jets_PTQQ-100to200_1J
    - Wto2Q-2Jets_PTQQ-100to200_2J
    - Wto2Q-2Jets_PTQQ-200to400_1J
    - Wto2Q-2Jets_PTQQ-200to400_2J
    - Wto2Q-2Jets_PTQQ-400to600_1J
    - Wto2Q-2Jets_PTQQ-400to600_2J
    - Wto2Q-2Jets_PTQQ-600_1J
    - Wto2Q-2Jets_PTQQ-600_2J
    - WtoLNu-2Jets_0J
    - WtoLNu-2Jets_1J
    - WtoLNu-2Jets_2J
    - Zto2Q-2Jets_PTQQ-100to200_1J
    - Zto2Q-2Jets_PTQQ-100to200_2J
    - Zto2Q-2Jets_PTQQ-200to400_1J
    - Zto2Q-2Jets_PTQQ-200to400_2J
    - Zto2Q-2Jets_PTQQ-400to600_1J
    - Zto2Q-2Jets_PTQQ-400to600_2J
    - Zto2Q-2Jets_PTQQ-600_1J
    - Zto2Q-2Jets_PTQQ-600_2J
  files_per_job:
    DYto2L-2Jets_MLL-50_0J: 100
    DYto2L-2Jets_MLL-50_1J: 100
    DYto2L-2Jets_MLL-50_2J: 100
    Wto2Q-2Jets_PTQQ-100to200_1J: 200
    Wto2Q-2Jets_PTQQ-100to200_2J: 200
    Wto2Q-2Jets_PTQQ-200to400_1J: 200
    Wto2Q-2Jets_PTQQ-200to400_2J: 200
    Wto2Q-2Jets_PTQQ-400to600_1J: 100
    Wto2Q-2Jets_PTQQ-400to600_2J: 100
    Wto2Q-2Jets_PTQQ-600_1J: 100
    Wto2Q-2Jets_PTQQ-600_2J: 100
    WtoLNu-2Jets_0J: 100
    WtoLNu-2Jets_1J: 100
    WtoLNu-2Jets_2J: 100
    Zto2Q-2Jets_PTQQ-100to200_1J: 100
    Zto2Q-2Jets_PTQQ-100to200_2J: 100
    Zto2Q-2Jets_PTQQ-200to400_1J: 200
    Zto2Q-2Jets_PTQQ-200to400_2J: 125
    Zto2Q-2Jets_PTQQ-400to600_1J: 100
    Zto2Q-2Jets_PTQQ-400to600_2J: 100
    Zto2Q-2Jets_PTQQ-600_1J: 100
    Zto2Q-2Jets_PTQQ-600_2J: 100
  batch_size: 10

# samples whose subsamples are all taken from the index (no "subsamples" key)
_common: &common
  TT: { files_per_job: 40 }
  QCD: { files_per_job: 30, batch_size: 5 }
  Hbb: { files_per_job: 40 }
  JetMET: { files_per_job: 20, chunksize: 10000 }
  EGamma: { files_per_job: 20 }
  Muon: { files_per_job: 20 }
  Tau: { files_per_job: 100 }

_singletop_all: &singletop_all
  subsamples:
    - TBbarQ_t-channel_4FS
    - TbarBQ_t-channel_4FS
    - TWminusto4Q
    - TbarWplusto4Q
    - TWminustoLNu2Q
    - TbarWplustoLNu2Q
  files_per_job: 40

_diboson_all: &diboson_all
  subsamples: [WW, WZ, ZZ]
  files_per_job: 40

# ---- per-year configs ----
"2022":
  <<: *common
  HHbbtt: *hhbbtt_2022_2023
  VJets: *vjets_2022_2023
  SingleTop: *singletop_all
  diboson: *diboson_all

"2022EE":
  <<: *common
  HHbbtt: *hhbbtt_2022_2023
  VJets: *vjets_2022_2023
  SingleTop: *singletop_all
  diboson: *diboson_all

"2023":
  <<: *common
  HHbbtt: *hhbbtt_2022_2023
  VJets: *vjets_2022_2023
  SingleTop:
    subsamples: # TbarWplustoLNu2Q not available for 2023
      - TBbarQ_t-channel_4FS
      - TbarBQ_t-channel_4FS
      - TWminusto4Q
      - TbarWplusto4Q
      - TWminustoLNu2Q
    files_per_job: 40
  diboson: *diboson_all

"2023BPix":
  <<: *common
  HHbbtt: *hhbbtt_2022_2023
  VJets: *vjets_2022_2023
  SingleTop: *singletop_all
  diboson:
    subsamples: [WW, WZ] # ZZ not available for 2023BPix
    files_per_job: 40

"2024":
  <<: *common
  HHbbtt:
    subsamples:
      - GluGlutoHHto2B2Tau_kl-1p00_kt-1p00_c2-0p00
      - GluGlutoHHto2B2Tau_kl-0p00_kt-1p00_c2-0p00
      - GluGlutoHHto2B2Tau_kl-2p45_kt-1p00_c2-0p00
      - GluGlutoHHto2B2Tau_kl-5p00_kt-1p00_c2-0p00
      - VBFHHto2B2Tau_CV_1_C2V_0_C3_1
      - VBFHHto2B2Tau_CV_1_C2V_1_C3_1
    files_per_job: 20
  VJets:
    subsamples:
      - DYto2E-2Jets_MLL-50_0J
      - DYto2E-2Jets_MLL-50_1J
      - DYto2E-2Jets_MLL-50_2J
      - DYto2Mu-2Jets_MLL-50_0J
      - DYto2Mu-2Jets_MLL-50_1J
      - DYto2Mu-2Jets_MLL-50_2J
      - DYto2Tau-2Jets_MLL-50_0J
      - DYto2Tau-2Jets_MLL-50_1J
      - DYto2Tau-2Jets_MLL-50_2J
      - WtoLNu-2Jets_PTLNu-40to100_1J
      - WtoLNu-2Jets_PTLNu-40to100_2J
      - WtoLNu-2Jets_PTLNu-100to200_1J
      - WtoLNu-2Jets_PTLNu-100to200_2J
      - WtoLNu-2Jets_PTLNu-200to400_1J
      - WtoLNu-2Jets_PTLNu-200to400_2J
      - WtoLNu-2Jets_PTLNu-400to600_1J
      - WtoLNu-2Jets_PTLNu-400to600_2J
      - WtoLNu-2Jets_PTLNu-600_1J
      - WtoLNu-2Jets_PTLNu-600_2J
      - Wto2Q-2Jets_PTQQ-100
      - Wto2Q-2Jets_PTQQ-200
      - Wto2Q-2Jets_PTQQ-400
      - Wto2Q-2Jets_PTQQ-600
      - Zto2Q-2Jets_PTQQ-100
      - Zto2Q-2Jets_PTQQ-200
      - Zto2Q-2Jets_PTQQ-400
      - Zto2Q-2Jets_PTQQ-600
    files_per_job: 100
    batch_size: 10
  SingleTop: *singletop_all
  diboson: *diboson_all
